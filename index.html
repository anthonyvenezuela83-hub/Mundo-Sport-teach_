<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mundo Sport y Tech</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .header-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
        }
        .logo-img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #00d2ff;
        }
        .brand-info h1 {
            margin: 0;
            font-size: 24px;
            color: #00d2ff;
        }
        .brand-info h2 {
            margin: 0;
            font-size: 20px;
            color: #ffffff;
        }
        .brand-info p {
            margin: 5px 0 0 0;
            font-size: 12px;
            letter-spacing: 1px;
            color: #a0aec0;
        }
        .whatsapp-btn {
            background-color: #25d366;
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            display: inline-block;
        }
        .description {
            font-size: 16px;
            color: #e2e8f0;
            max-width: 600px;
            margin: 0 auto 40px auto;
            line-height: 1.5;
        }
        .stock-section h2 {
            font-size: 28px;
            margin-bottom: 5px;
        }
        .underline {
            width: 60px;
            height: 4px;
            background-color: #00d2ff;
            margin: 0 auto 30px auto;
            border-radius: 2px;
        }
        .product-card {
            background-color: #161b22;
            border-radius: 12px;
            overflow: hidden;
            max-width: 350px;
            margin: 0 auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .product-card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
        }
        .product-info {
            padding: 15px;
        }
        .product-info h3 {
            margin: 0;
            font-size: 18px;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <!-- ENCABEZADO CON LOGO Y BOTÓN DE WHATSAPP -->
    <header class="header-container">
        <img src="https://images.unsplash.com/photo-1517838277536-f5f99be501cd?w=150&auto=format&fit=crop&q=80" alt="Logo Mundo Sport y Tech" class="logo-img">
        
        <div class="brand-info">
            <h1>Mundo SPORT</h1>
            <h2>& tech</h2>
            <p>TECNOLOGÍA PARA TU MOVIMIENTO</p>
        </div>
        
        <a href="https://wa.me/" class="whatsapp-btn">💬 Contáctame</a>
    </header>

    <!-- DESCRIPCIÓN DE LA MARCA -->
    <p class="description">
        Selecciono personalmente lo último en tecnología deportiva, relojes tácticos y accesorios de alto rendimiento para acompañar cada uno de tus desafíos diarios.
    </p>

    <!-- SECCIÓN DE STOCK DISPONIBLE -->
    <section class="stock-section">
        <h2>Mi Stock Disponible</h2>
        <div class="underline"></div>

        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500&auto=format&fit=crop&q=80" alt="GT Grand Touring Watch">
            
            <div class="product-info">
                <h3>GT Grand Touring Watch</h3>
            </div>
        </div>
    </section>

</body>
</html>
